question: How does Deja turn an IAM-signed alert into durable learning, recover from interruption, and expose evidence safely?
audience:
  - Hackathon judges
  - Backend engineers
  - Site reliability engineers
diagram_type: Informal implementation architecture
notation: Typed containers, stores, trust boundaries, and directed runtime or data relationships
scope: Deja alert ingestion, agent execution, memory, recovery, and read-only operations
abstraction: Implementation and deployment
time_reference: AS-IS on 2026-07-28
evidence:
  - src/deja/app.py
  - src/deja/execution.py
  - src/deja/workflow.py
  - src/deja/repository.py
  - src/deja/memory.py
  - src/deja/triage.py
  - dashboard/src/lib/data.ts
  - deploy/lambda-trust-policy.json
  - deploy/chaos-compose.yml
  - docs/observability/read-only-access.md
assumptions: []
omissions:
  - CockroachDB internal replication topology
  - Provider-internal model serving architecture
  - Table and checkpoint column details
  - AWS account networking not represented in the repository
nodes:
  - id: alert-source
    type: External actor
    name: Alert source
    responsibility: Sends an IAM-signed incident payload
    boundary: Outside Deja
  - id: lambda-api
    type: Container
    name: Lambda API
    responsibility: Validates the alert, reserves stable identities, and returns HTTP 202
    technology: FastAPI, Mangum, AWS Lambda Function URL
    boundary: AWS Lambda execution
  - id: lambda-worker
    type: Container
    name: Lambda worker
    responsibility: Claims an execution lease and resumes the durable graph
    technology: AWS Lambda asynchronous self-invocation
    boundary: AWS Lambda execution
  - id: agent-graph
    type: Workflow
    name: Incident agent
    responsibility: Ingests, recalls, triages, recommends, and writes back
    technology: LangGraph
    boundary: AWS Lambda execution
  - id: groq
    type: External system
    name: Groq
    responsibility: Produces schema-validated incident triage
    boundary: External provider
  - id: voyage
    type: External system
    name: VoyageAI
    responsibility: Embeds alerts and novel postmortems
    boundary: External provider
  - id: working-memory
    type: Store
    name: Working memory
    responsibility: Persists checkpoints, execution leases, attempts, and node effects
    technology: CockroachDB and CockroachDBSaver
    boundary: CockroachDB Cloud
  - id: episodic-memory
    type: Store
    name: Episodic memory
    responsibility: Stores and retrieves completed incident precedent
    technology: CockroachDB vector storage and C-SPANN
    boundary: CockroachDB Cloud
  - id: procedural-memory
    type: Store
    name: Procedural memory
    responsibility: Learns duplicate-notification and runbook efficacy evidence
    technology: CockroachDB relational tables
    boundary: CockroachDB Cloud
  - id: dashboard
    type: Container
    name: Operations dashboard
    responsibility: Serves a public sanitized read-only snapshot
    technology: Next.js on Vercel
    boundary: Read-only operations
  - id: mcp-client
    type: External actor
    name: MCP client
    responsibility: Queries the Deja cluster through single-cluster read authorization
    boundary: Read-only operations
edges:
  - from: alert-source
    to: lambda-api
    type: Call
    label: Submit signed alert
    protocol: HTTPS with AWS SigV4
  - from: lambda-api
    to: lambda-worker
    type: Event
    label: Queue stable run identity
    protocol: Lambda asynchronous invocation
  - from: lambda-worker
    to: agent-graph
    type: Call
    label: Execute or resume
  - from: agent-graph
    to: working-memory
    type: Data flow
    label: Checkpoint, lease, attempt, and node effect
  - from: working-memory
    to: lambda-worker
    type: Data flow
    label: Resume cursor after retry
  - from: agent-graph
    to: episodic-memory
    type: Data flow
    label: Retrieve precedent and store novel postmortem
  - from: agent-graph
    to: procedural-memory
    type: Data flow
    label: Read and record operational evidence
  - from: agent-graph
    to: groq
    type: Call
    label: Request validated triage
  - from: agent-graph
    to: voyage
    type: Call
    label: Embed search or postmortem text
  - from: working-memory
    to: dashboard
    type: Data flow
    label: Sanitized read-only snapshot
  - from: episodic-memory
    to: dashboard
    type: Data flow
    label: Precedent evidence
  - from: procedural-memory
    to: dashboard
    type: Data flow
    label: Noise and runbook evidence
  - from: mcp-client
    to: working-memory
    type: Call
    label: Read-only SQL query
boundaries:
  - id: aws-runtime
    type: Deployment and trust
    contains:
      - lambda-api
      - lambda-worker
      - agent-graph
  - id: cockroach-cloud
    type: Deployment and data ownership
    contains:
      - working-memory
      - episodic-memory
      - procedural-memory
  - id: read-only-operations
    type: Authorization
    contains:
      - dashboard
      - mcp-client
legend:
  - Solid arrows are calls, events, or persisted data flows.
  - Dashed arrows are retry or resume paths.
  - The recommendation boundary permits recorded advice, not infrastructure mutation.
