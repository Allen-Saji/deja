[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "deja"
version = "0.1.0"
description = "A durable incident response agent backed by CockroachDB."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.116,<1",
  "groq>=0.30,<1",
  "langchain-cockroachdb==0.2.1",
  "langgraph>=0.6,<2",
  "mangum>=0.19,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "boto3>=1.40,<2",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
deja-simulate = "deja.simulator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
